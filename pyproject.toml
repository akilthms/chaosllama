[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chaosllama"
version = "0.1.0"
description = "ChaosLlama - A chaos engineering tool for LLM applications"
requires-python = ">=3.12"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["chaosllama*"]
exclude = ["tests*", "config*", "mlruns*", "assets*", "profiles*", "notebooks*", "guidelines*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
